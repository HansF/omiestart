<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omiestart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127799;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f2eb;
    --bg-glow: #fdf9f4;
    --card: #ffffff;
    --text: #2a2420;
    --muted: #7a6e64;
    --accent: #b8553a;
    --accent-soft: #f6e6df;
    --line: #e8dfd4;
    --shadow: 0 1px 2px rgba(60, 40, 20, .05), 0 4px 14px rgba(60, 40, 20, .06);
    --shadow-hover: 0 2px 4px rgba(60, 40, 20, .06), 0 10px 24px rgba(60, 40, 20, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1916;
      --bg-glow: #26211d;
      --card: #2a2420;
      --text: #f2ebe3;
      --muted: #a89c91;
      --accent: #e2876b;
      --accent-soft: #3a2b25;
      --line: #3a322c;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --shadow-hover: 0 6px 20px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 60%) fixed;
    color: var(--text);
    font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 9vh 16px 48px;
  }

  /* Greeting */
  header { text-align: center; margin-bottom: 36px; }
  #greeting {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  #today { font-size: 1.2rem; color: var(--muted); }
  #today .dot { margin: 0 10px; opacity: .5; }

  /* Search */
  .search { position: relative; width: 100%; max-width: 640px; margin-bottom: 48px; }
  .search form {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 30px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .search form:focus-within { border-color: var(--accent); box-shadow: var(--shadow-hover); }
  .search.open form { border-radius: 30px 30px 0 0; border-bottom-color: var(--line); }
  .search svg { flex: none; width: 24px; height: 24px; margin-left: 22px; color: var(--muted); }
  .search input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.25rem;
    padding: 17px 22px 17px 14px;
    border: 0;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  .search input::placeholder { color: var(--muted); }

  #suggestions {
    position: absolute;
    left: 0; right: 0; top: 100%;
    z-index: 10;
    margin: 0;
    padding: 6px 0 10px;
    list-style: none;
    background: var(--card);
    border: 2px solid var(--accent);
    border-top: 0;
    border-radius: 0 0 30px 30px;
    box-shadow: var(--shadow-hover);
  }
  #suggestions[hidden] { display: none; }
  #suggestions li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 24px;
    font-size: 1.15rem;
    cursor: pointer;
  }
  #suggestions li svg { width: 18px; height: 18px; margin: 0; color: var(--muted); flex: none; }
  #suggestions li.active, #suggestions li:hover { background: var(--accent-soft); }
  #suggestions b { font-weight: 600; }

  /* Tiles */
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 920px;
  }
  .tile {
    width: 136px;
    padding: 20px 10px 16px;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 18px;
    box-shadow: var(--shadow);
    color: var(--text);
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent);
    outline: none;
  }
  .icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.5rem; font-weight: 600; color: var(--accent);
    overflow: hidden;
  }
  .icon img { width: 34px; height: 34px; }
  .tile span { font-size: 1.05rem; font-weight: 600; text-align: center; line-height: 1.25; }

  /* News */
  .news { width: 100%; max-width: 896px; margin-top: 64px; }
  .news[hidden] { display: none; }
  .news-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .news h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.8rem; margin: 0; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .tabs button:hover { border-color: var(--accent); }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .stories {
    list-style: none;
    margin: 0;
    padding: 6px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .stories a {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px;
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    transition: background .15s;
  }
  .stories a:hover, .stories a:focus-visible { background: var(--accent-soft); outline: none; }
  .stories li + li { border-top: 1px solid var(--line); }
  .stories .thumb {
    flex: none;
    width: 112px; height: 74px;
    border-radius: 10px;
    background: var(--accent-soft) center / cover no-repeat;
  }
  .stories .title { font-size: 1.15rem; font-weight: 600; line-height: 1.35; }
  .stories .when { display: block; margin-top: 4px; font-size: .95rem; font-weight: 400; color: var(--muted); }

  @media (max-width: 520px) {
    body { padding-top: 6vh; }
    .grid { gap: 12px; }
    .tile { width: calc(50% - 6px); }
    .stories .thumb { width: 84px; height: 60px; }
    .stories a { gap: 14px; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="greeting">Dag omie!</h1>
    <div id="today"><span id="date"></span><span class="dot">&bull;</span><span id="clock"></span></div>
  </header>

  <div class="search" id="search">
    <form action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" name="q" placeholder="Wat wil je opzoeken?" autofocus autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
    </form>
    <ul id="suggestions" role="listbox" hidden></ul>
  </div>

  <main class="grid" id="links"></main>

  <section class="news" id="news" hidden>
    <div class="news-head">
      <h2>Het nieuws</h2>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <ul class="stories" id="stories"></ul>
  </section>

<script>
  // Pas hier de knoppen aan: [naam, adres]
  const LINKS = [
    ["Facebook", "https://www.facebook.com/"],
    ["Instagram", "https://www.instagram.com/"],
    ["HLN", "https://www.hln.be/"],
    ["HBVL", "https://www.hbvl.be/"],
    ["In memoriam", "https://www.inmemoriam.be/"],
    ["Seniorennet", "https://www.seniorennet.be/"],
    ["BNP", "https://www.bnpparibasfortis.be/"],
    ["Mijn gezondheid", "https://www.mijngezondheid.belgie.be/"],
    ["bol", "https://www.bol.com/be/nl/"],
    ["Delhaize", "https://www.delhaize.be/nl"],
  ];

  // Tiles
  const grid = document.getElementById("links");
  for (const [name, url] of LINKS) {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = url;
    const icon = document.createElement("div");
    icon.className = "icon";
    const img = document.createElement("img");
    img.alt = "";
    img.src = "https://www.google.com/s2/favicons?sz=128&domain_url=" + encodeURIComponent(url);
    img.onerror = () => { icon.textContent = name[0].toUpperCase(); };
    icon.append(img);
    const label = document.createElement("span");
    label.textContent = name;
    a.append(icon, label);
    grid.append(a);
  }

  // Greeting, date and clock
  function tick() {
    const now = new Date();
    const h = now.getHours();
    const part = h < 6 ? "Goeienacht" : h < 12 ? "Goeiemorgen" : h < 18 ? "Goeiemiddag" : "Goeieavond";
    document.getElementById("greeting").textContent = part + ", omie!";
    const date = now.toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long" });
    document.getElementById("date").textContent = date[0].toUpperCase() + date.slice(1);
    document.getElementById("clock").textContent = now.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
  }
  tick();
  setInterval(tick, 10000);

  // Search suggestions (Google suggest via JSONP)
  const box = document.getElementById("search");
  const form = box.querySelector("form");
  const input = document.getElementById("q");
  const list = document.getElementById("suggestions");
  const searchIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  let items = [], active = -1, typed = "", requestId = 0, timer;

  function setOpen(open) {
    list.hidden = !open;
    box.classList.toggle("open", open);
    input.setAttribute("aria-expanded", open);
  }

  function render() {
    list.innerHTML = "";
    items.forEach((text, i) => {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.className = i === active ? "active" : "";
      const rest = text.toLowerCase().startsWith(typed.toLowerCase()) ? text.slice(typed.length) : null;
      li.innerHTML = searchIcon;
      const span = document.createElement("span");
      if (rest !== null) {
        span.append(text.slice(0, typed.length));
        const b = document.createElement("b");
        b.textContent = rest;
        span.append(b);
      } else {
        span.textContent = text;
      }
      li.append(span);
      li.addEventListener("mousedown", e => { e.preventDefault(); go(text); });
      list.append(li);
    });
    setOpen(items.length > 0);
  }

  function go(text) {
    input.value = text;
    setOpen(false);
    form.submit();
  }

  function fetchSuggestions(q) {
    const id = ++requestId;
    const cb = "omieSuggest" + id;
    const script = document.createElement("script");
    window[cb] = data => {
      delete window[cb];
      script.remove();
      if (id !== requestId) return;
      items = (data[1] || []).slice(0, 7);
      active = -1;
      render();
    };
    script.onerror = () => { delete window[cb]; script.remove(); };
    script.src = "https://suggestqueries.google.com/complete/search?client=chrome&hl=nl&gl=be&ie=utf-8&oe=utf-8&q="
      + encodeURIComponent(q) + "&callback=" + cb;
    document.head.append(script);
  }

  input.addEventListener("input", () => {
    typed = input.value;
    clearTimeout(timer);
    if (!typed.trim()) { requestId++; items = []; setOpen(false); return; }
    timer = setTimeout(() => fetchSuggestions(typed), 120);
  });

  input.addEventListener("keydown", e => {
    if (list.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const n = items.length + 1; // -1 = what was typed
      active = ((active + 1 + (e.key === "ArrowDown" ? 1 : -1) + n) % n) - 1;
      input.value = active === -1 ? typed : items[active];
      render();
    } else if (e.key === "Escape") {
      input.value = typed;
      setOpen(false);
    }
  });

  // News (feeds.json is refreshed every 30 minutes by GitHub Actions)
  function ago(iso) {
    if (!iso) return "";
    const min = Math.round((Date.now() - new Date(iso)) / 60000);
    if (min < 1) return "zonet";
    if (min < 60) return min + " min geleden";
    const h = Math.round(min / 60);
    if (h < 24) return h + " uur" + " geleden";
    const d = Math.round(h / 24);
    return d === 1 ? "gisteren" : d + " dagen geleden";
  }

  fetch("feeds.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(({ feeds }) => {
      feeds = feeds.filter(f => f.items.length);
      if (!feeds.length) return;
      const tabs = document.getElementById("tabs");
      const stories = document.getElementById("stories");
      let saved = null;
      try { saved = localStorage.getItem("omiestart-feed"); } catch {}

      function show(name) {
        const feed = feeds.find(f => f.name === name) || feeds[0];
        try { localStorage.setItem("omiestart-feed", feed.name); } catch {}
        for (const b of tabs.children) b.setAttribute("aria-selected", b.textContent === feed.name);
        stories.innerHTML = "";
        for (const item of feed.items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = item.link;
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          if (item.image) thumb.style.backgroundImage = `url("${item.image.replace(/"/g, "%22")}")`;
          const text = document.createElement("div");
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = item.title;
          const when = document.createElement("span");
          when.className = "when";
          when.textContent = ago(item.date);
          text.append(title, when);
          a.append(thumb, text);
          li.append(a);
          stories.append(li);
        }
      }

      for (const f of feeds) {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "tab");
        b.textContent = f.name;
        b.addEventListener("click", () => show(f.name));
        tabs.append(b);
      }
      show(saved);
      document.getElementById("news").hidden = false;
    })
    .catch(() => {});

  input.addEventListener("blur", () => setOpen(false));
  input.addEventListener("focus", () => { if (items.length && input.value) render(); });
</script>
</body>
</html>
